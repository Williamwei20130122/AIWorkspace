# AI Workspace 生产部署编排（ECS：PostgreSQL / Redis 自行安装，仅应用跑在 Docker）
#
# 使用方式：
#   1. cp .env.example .env      然后按注释填写连接串与密钥
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. 打开 http://<ECS 公网IP>:3002 完成初始化，或以管理员登录
#
# 说明：
#   - PostgreSQL 与 Redis 装在宿主机（而非容器）时，容器内通过 host.docker.internal 访问，
#     下方 extra_hosts 已把该域名映射到宿主机网关（Linux 需要 docker 20.10+）。
#   - 若数据库/缓存是独立的内网 RDS，直接把 .env 里的地址改成内网域名或 IP 即可，
#     并删掉 extra_hosts。
#   - 素材统一落应用本地磁盘（已挂载到 ./data），无任何对象存储/CDN 依赖。

# Compose 项目名：容器、网络、卷统一以 aiworkspace 为前缀（不再使用 newapi/new-api）
name: aiworkspace

services:
  aiworkspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建建议保持默认镜像源；如需官方源可在此覆盖
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ai-workspace:${IMAGE_TAG:-latest}
    container_name: ai-workspace
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${APP_PORT:-3002}:3002"
    volumes:
      # /data 存放 SQLite（未用 PG 时）、素材文件、上传文件等；务必持久化
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - WORKSPACE_ARTIFACT_DIR=/data/workspace-artifacts
    extra_hosts:
      # 让容器能访问宿主机上安装的 PostgreSQL / Redis
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3002/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # 支撑 400-500 并发需要预留足够内存；按 ECS 规格调整
          memory: ${APP_MEMORY_LIMIT:-2g}
        reservations:
          memory: 512m
