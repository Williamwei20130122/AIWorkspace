<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>正在返回 AI Workspace…</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #4c1d95;
        background: linear-gradient(180deg, #f5f3ff 0%, #ede9fe 100%);
      }
      .box {
        text-align: center;
        font-size: 14px;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 12px;
        border: 3px solid #ddd6fe;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div id="tip">正在返回 AI Workspace…</div>
    </div>
    <script>
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var payload = {
          type: 'aiworkspace-oauth-callback',
          provider: '',
          mode: '',
          code: params.get('code') || '',
          state: params.get('state') || '',
          error: params.get('error') || '',
          errorDescription:
            params.get('error_description') ||
            params.get('error_msg') ||
            params.get('errmsg') ||
            '',
        }

        // state 约定为 "aiworkspace:oauth:<provider>:<mode>:<nonce>"
        var parts = String(payload.state).split(':')
        if (parts.length >= 4) {
          payload.provider = parts[2] || ''
          payload.mode = parts[3] || ''
        }

        var delivered = false
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, window.location.origin)
            delivered = true
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, window.location.origin)
            delivered = true
          }
        } catch (e) {}

        if (!delivered) {
          document.getElementById('tip').textContent =
            payload.error || '未能回传授权结果，请关闭本页后重试。'
          return
        }

        document.getElementById('tip').textContent = '授权成功，正在返回…'
        setTimeout(function () {
          try {
            window.close()
          } catch (e) {}
        }, 300)
      })()
    </script>
  </body>
</html>
