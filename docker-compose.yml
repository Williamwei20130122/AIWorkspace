# AIWorkspace 教学系统 —— 单容器部署（Go 后端内嵌 React 前端 + SQLite）
# 宿主机访问地址：http://localhost:3100
#
# 使用：
#   cp .env.example .env        # 修改 AUTH_SECRET 为随机长字符串
#   docker compose up -d --build
#   docker compose logs -f web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可用镜像源；能直连官方源时删掉这两行即可
        NPM_REGISTRY: https://registry.npmmirror.com
        GOPROXY: https://goproxy.cn,direct
    image: aiworkspace:latest
    container_name: aiworkspace-web
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      DATABASE_PATH: /data/app.db
      # 生产环境务必替换：openssl rand -base64 48
      AUTH_SECRET: "${AUTH_SECRET:-aiworkspace-dev-secret-change-me}"
      # 首次启动（空库）自动写入演示数据；设为 0 可关闭
      SEED_ON_START: "${SEED_ON_START:-1}"
    volumes:
      - aiworkspace-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  aiworkspace-data:
